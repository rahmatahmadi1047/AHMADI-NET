name: Android APK
on:
  push:
    branches: [main, ahmadi-vpn-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check Worker JavaScript and config
        run: |
          node --input-type=module --check < cloudflare-worker/src/index.js
          node -e "JSON.parse(require('fs').readFileSync('cloudflare-worker/wrangler.jsonc', 'utf8'))"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :customer-app:assembleDebug :vpn-app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHMADI-NET-and-AHMADI-VPN-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            customer-app/build/outputs/apk/debug/customer-app-debug.apk
            vpn-app/build/outputs/apk/debug/vpn-app-debug.apk
          if-no-files-found: error
          retention-days: 14
